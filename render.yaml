services:
  - type: web
    name: gyodong-agent
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: ACTION_TOKEN
        sync: false
      - key: KAKAO_BOT_TOKEN
        sync: false
      - key: LLM_MODEL
        value: gpt-4.1
